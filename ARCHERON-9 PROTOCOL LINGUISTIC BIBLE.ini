# III. GRAMMAR STRUCTURE

Word Order:

ACTION – STATUS – TARGET

Modifiers follow noun.
No articles.

Plural suffix: -yn
Abstract/state suffix: -osh
Authority prefix: Vz-
Negation prefix: Ne-
Escalation marker: -IX

Declarative only.
No contraction.

